<script>
'use strict';
// =====================================================================
//  LIGHTS OUT!  The Bolt & Dot Show  —  core engine
// =====================================================================
const W = 960, H = 540, FLOOR = 470, DT = 1 / 60, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const sgn = v => v < 0 ? -1 : 1;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const angTo = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
const deg = d => d * Math.PI / 180;
const ease = {
  lin: t => t,
  outQ: t => 1 - (1 - t) * (1 - t),
  inQ: t => t * t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outEl: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; }
};
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash2(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function fmtTime(s) { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; }
function rectsHit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function circRect(cx, cy, r, x, y, w, h) { const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h); return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r; }

function LB() {
  const d = { g: [], p: [], m: [], c: [], e: [], coins: [], pinks: [], hz: [], sec: [] };
  const B = {
    d,
    ground(x0, x1, y = FLOOR, o = {}) { d.g.push(Object.assign({ x0, x1, y }, o)); return B; },
    plat(x, y, w) { d.p.push({ x, y, w }); return B; },
    mover(x, y, w, ax, ay, per, ph = 0) { d.m.push({ kind: 'line', x, y, w, ax, ay, per, ph }); return B; },
    wheel(cx, cy, r, n, per, w = 80) { for (let i = 0; i < n; i++) d.m.push({ kind: 'circle', cx, cy, r, per, ph: i / n * TAU, w }); return B; },

    en(type, x, y, o) { d.e.push({ type, x, y, o }); return B; },
    coin(x, y) { d.coins.push({ x, y }); return B; },
    pink(x, y) { d.pinks.push({ x, y }); return B; },
    hz(type, x, o = {}) { d.hz.push(Object.assign({ type, x }, o)); return B; },
    secret(x, y, w, h, rx, ry) { d.sec.push({ x, y, w, h, rx, ry }); return B; }
  };
  return B;
}

// ---------------- flow ----------------
function startBoss(id, diff, extra = {}) { const cfg = Object.assign({ type: 'boss', id, diff, coop: Save.d.players === 2 }, extra); go(() => new Stage(cfg)); }
function startLevel(id, extra = {}) { const cfg = Object.assign({ type: 'level', id, diff: 'normal', coop: Save.d.players === 2 }, extra); go(() => new Stage(cfg)); }
function startRush(diff) { const rush = { list: BOSSES.map(b => b.id), i: 0, time: 0, diff, stats: { hits: 0, parries: 0, cards: 0 } }; startBoss(rush.list[0], diff, { rush }); }
function retryStage(st) { const cfg = Object.assign({}, st.cfg); go(() => new Stage(cfg)); }
function exitStage(st) { Music.stop(.3); if (st.cfg.practice) go(() => new PracticeScene()); else if (st.cfg.rush) go(() => new MainMenu()); else go(() => new MapScene(st.lvl ? st.lvl.world - 1 : st.def.world - 1)); }
function onStageWon(r) {
  const S = Save.d;
  if (r.practice) { go(() => new ResultsScene(r, () => new PracticeScene())); return; }
  if (r.rush) {
    const R = r.rush; R.time += r.time; R.stats.hits += r.hits; R.stats.parries += r.parries; R.stats.cards += r.cards;
    if (R.i < R.list.length - 1) {
      const carry = r.carry.map(c => ({ hp: Math.min(9, (c.dead ? 1 : c.hp) + 1), meter: c.meter }));
      const nextRush = Object.assign({}, R, { i: R.i + 1 }); const nextDef = BOSSES.find(b => b.id === R.list[R.i + 1]);
      go(() => new ResultsScene(r, () => new Stage({ type: 'boss', id: nextDef.id, diff: R.diff, coop: r.coop, rush: nextRush, carry }), { msgs: ['NEXT UP: ' + nextDef.name.toUpperCase(), 'You heal 1 HP.'] }));
      return;
    }
    const total = { type: 'boss', name: 'Boss Rush', diff: R.diff, time: R.time, par: BOSSES.reduce((s, b) => s + b.par, 0), hp: r.hp, parries: R.stats.parries, cards: R.stats.cards, hits: R.stats.hits, coins: 0 };
    total.grade = computeGrade(total);
    const msgs = []; const best = S.rush;
    Achieve.unlock('rush');
    if (!best) { S.coins += 5; msgs.push('First rush cleared! +5 COINS'); }
    if (!best || total.time < best.time) { S.rush = { time: total.time, diff: R.diff, grade: total.grade }; msgs.push('New best rush time!'); }
    Save.write();
    go(() => new ResultsScene(total, () => new MainMenu(), { msgs, rushTotal: R.time }));
    return;
  }
  const msgs = []; let ending = false;
  if (r.type === 'boss') {
    const rec = Save.bossRec(r.id), def = BOSSES.find(b => b.id === r.id);
    rec.beat = true;
    if (!rec.grades[r.diff] || GRADE_ORDER.indexOf(r.grade) > GRADE_ORDER.indexOf(rec.grades[r.diff])) rec.grades[r.diff] = r.grade;
    if (!rec.best || r.time < rec.best) rec.best = r.time;
    const tier = { easy: 1, normal: 2, expert: 3 }[r.diff]; const pay = tier - (rec.paid || 0);
    rec.medals = rec.medals || {}; const md = rec.medals;
    if (r.hits === 0 && !md.nohit) { md.nohit = 1; msgs.push('Challenge: UNTOUCHED!'); } if (r.parries >= 5 && !md.parry) { md.parry = 1; msgs.push('Challenge: PARRY PRO!'); } if (r.time <= r.par && !md.speed) { md.speed = 1; msgs.push('Challenge: UNDER PAR!'); }
    Achieve.unlock('first'); if (r.diff === 'expert') Achieve.unlock('expert'); if (r.grade === 'S') Achieve.unlock('srank'); if (r.hits === 0) Achieve.unlock('nohit'); if (r.parries >= 5) Achieve.unlock('parry5'); if (r.time <= r.par) Achieve.unlock('speed'); if (r.coop) Achieve.unlock('coop');
    if (BOSSES.every(b => S.bosses[b.id] && S.bosses[b.id].beat)) Achieve.unlock('allb'); if (r.id === 'gloom') Achieve.unlock('gloom');
    if (pay > 0) { S.coins += pay; rec.paid = tier; msgs.push('+' + pay + ' COIN' + (pay > 1 ? 'S' : '') + ' for winning on ' + DIFF[r.diff].name + '!'); }
    const w = WORLDS[def.world - 1];
    if (w.bosses.every(id => S.bosses[id] && S.bosses[id].beat)) {
      const sup = ['beam', 'glow', 'bolt'][w.n - 1];
      if (sup && !S.owned.supers.includes(sup)) { S.owned.supers.push(sup); if (!S.load.sup) S.load.sup = sup; Notices.push({ title: 'NEW SUPER!', body: SUPERS[sup].name + ': ' + SUPERS[sup].desc + ' Fill all 5 cards and press EX.', icon: 'bulb' }); }
      if (w.n < 5 && S.worlds < w.n + 1) { S.worlds = w.n + 1; S.lastWorld = w.n; Notices.push({ title: 'WORLD ' + (w.n + 1) + ' UNLOCKED!', body: WORLDS[w.n].name + ' awaits. ' + WORLDS[w.n].sub + '. New goods are in the shop, too!', icon: 'bulb' }); msgs.push('World ' + (w.n + 1) + ' unlocked!'); }
      if (w.n === 5 && !S.ended) { S.ended = true; ending = true; }
    }
  } else {
    const rec = Save.levelRec(r.id); rec.done = true;
    const st = scene; let got = 0;
    for (const idx of (st.gotCoins || [])) if (!rec.coins[idx]) { rec.coins[idx] = true; S.coins++; got++; }
    if (got) msgs.push('+' + got + ' COIN' + (got > 1 ? 'S' : '') + ' banked!');

const Ambient = {
  nodes: [], timer: null,
  start(kind) {
    this.stop(); if (!AudioSys.ok || !kind) return;
    const ac = AudioSys.ac, out = ac.createGain(); out.gain.value = 0; out.gain.linearRampToValueAtTime(.32, ac.currentTime + 1.5); out.connect(AudioSys.sfx);
    const noise = (type, f, q) => { const s = ac.createBufferSource(); s.buffer = AudioSys.noise; s.loop = true; const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; const g = ac.createGain(); s.connect(b); b.connect(g); g.connect(out); s.start(); this.nodes.push(s); return { s, b, g }; };
    const lfo = (param, rate, depth, base) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = rate; g.gain.value = depth; param.value = base; o.connect(g); g.connect(param); o.start(); this.nodes.push(o); };

    else if (kind === 'water') { const n = noise('lowpass', 700, .5); lfo(n.g.gain, .2, .2, .35); this.timer = setInterval(() => { if (Math.random() < .5) Sfx.tone('sine', rnd(500, 900), rnd(1100, 1600), .08, .025); }, 700); }
    else if (kind === 'crowd') { const n = noise('bandpass', 650, 1.5); lfo(n.g.gain, 3.1, .12, .3); const m = noise('bandpass', 1100, 2); lfo(m.g.gain, 4.3, .08, .15); }
    else if (kind === 'hum') { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 55; const b = ac.createBiquadFilter(); b.type = 'lowpass'; b.frequency.value = 160; const g = ac.createGain(); g.gain.value = .12; o.connect(b); b.connect(g); g.connect(out); o.start(); this.nodes.push(o); const n = noise('lowpass', 300, .5); n.g.gain.value = .3; this.timer = setInterval(() => { if (Math.random() < .3) Sfx.noise(.12, .05, 'bandpass', 2500, 1200, 3); }, 900); }
    else if (kind === 'drone') { for (const f of [55, 82.4]) { const o = ac.createOscillator(); o.frequency.value = f; o.detune.value = rnd(-8, 8); const g = ac.createGain(); g.gain.value = .14; o.connect(g); g.connect(out); o.start(); this.nodes.push(o); lfo(g.gain, .07 + f / 900, .06, .12); } const n = noise('lowpass', 250, .5); n.g.gain.value = .25; }

  }
};

      else { const tx = clamp(P.x, L, R); warnRect(st, tx, e.gy - 6, 90, 12, 1, { col: '#ff5040' }); const T = 1, g = 900, x = e.x, y = e.y - e.h; st.bullet({ x, y, vx: (tx - x) / T, vy: (e.gy - 10 - y - .5 * g * T * T) / T, g, r: 13, dr: q => drawPshot({ x: q.x, y: q.y, vx: 1, vy: 0, t: q.t, k: 'bomb', r: 10 }), floorDie: true, floorY: e.gy, onFloor: q => FX.boom(q.x, q.y, .9) }); Sfx.whoosh(); e.cd = 1.4; }
    }
  }
  else if (M.pat === 'phase') {

    else if (e.st === 'fade') { e.wt -= dt; if (e.wt <= 0) { e.x = clamp(P.x + (Math.random() < .5 ? -1 : 1) * 220, L, R); e.st = 'idle'; e.cd = 2.2; const n = 12, off = rnd(TAU); for (let i = 0; i < n; i++) st.bullet({ x: e.x, y: e.y - e.h / 2, vx: Math.cos(off + i * TAU / n) * 160, vy: Math.sin(off + i * TAU / n) * 160, r: 10, dr: drShadowOrb, pink: i === 0 }); FX.puffs(e.x, e.y - 40, 8, 16, '#e8e8ff'); Sfx.zap(); } }
  }
  if (!e.ghostly && e.st !== 'drop') for (const p of st.alive()) { const r = { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h }; if (rectsHit(r, p.rect)) p.hurt(); }
}
function miniDied(st, e) {

}
